aid: iki-ai
name: IKI AI
description: >-
  IKI AI is an AI-native workspace for knowledge, research, strategy, and
  creative work, backed by 500 Global. It pairs an AI assistant that summarizes,
  highlights, and connects saved content with an AI editor that grounds writing
  in a user's personal knowledge base, plus shared Team Spaces and a browser
  extension for one-click webpage saving with notes. The product targets
  researchers, students, consultants, copywriters, coaches, lawyers, founders,
  and venture teams, and emphasizes privacy with a choice of top-tier LLMs.
  IKI AI is delivered as a consumer and team SaaS (web app at app.iki.ai and a
  Chrome extension) with subscription plans; it does not currently publish a
  public developer API, SDKs, or OpenAPI. This profile tracks its public
  identity, commercial, and security surface in the API Evangelist network.
